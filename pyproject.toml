[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdl-companionwulf"
version = "0.5.0"
description = "SQLite-backed companion and queue manager for tdl"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tdl-companionwulf = "tdl_companionwulf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
