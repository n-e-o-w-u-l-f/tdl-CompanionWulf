name: Feature request
description: Propose a focused CompanionWulf improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Use case
      description: What problem should the feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired CLI or workflow behavior.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Sidecart or tdl compatibility impact
