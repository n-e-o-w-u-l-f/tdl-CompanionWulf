name: Bug report
description: Report reproducible CompanionWulf behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include Telegram credentials, tdata contents, verification codes, or private chat data."
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands or steps. Redact sensitive identifiers.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CompanionWulf version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11 / Python 3.14 / tdl ..."
